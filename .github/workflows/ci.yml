name: ci
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validate-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lint Markdown (ne bloque pas si des warnings existent)
      - name: Install markdownlint
        run: npm install -g markdownlint-cli
      - name: Run markdownlint
        run: markdownlint "**/*.md" || true

  build-static-preview:
    runs-on: ubuntu-latest
    needs: validate-markdown
    steps:
      - uses: actions/checkout@v4

      # Étape prête pour MkDocs (sans échec si mkdocs.yml absent)
      - name: Try MkDocs build if config present
        run: |
          if [ -f "mkdocs.yml" ]; then
            pipx install mkdocs mkdocs-material || pip install mkdocs mkdocs-material
            mkdocs build --strict
          else
            echo "mkdocs.yml non présent, build statique ignoré."
          fi
